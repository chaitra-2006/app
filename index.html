<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone</title><style>body{margin:0;background:#111;color:#fff;text-align:center;font-family:sans-serif}input{width:80%;padding:15px;font-size:24px;margin:20px;border-radius:10px;text-align:center}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto}button{padding:20px;font-size:20px;border-radius:50%;border:none;background:#333;color:#fff}.c{background:#0f0;color:#000;border-radius:20px;grid-column:span 3}</style></head><body><h2>📞 My Phone</h2><input id=d placeholder="Number"><div class=g><button onclick="d.value+='1'">1</button><button onclick="d.value+='2'">2</button><button onclick="d.value+='3'">3</button><button onclick="d.value+='4'">4</button><button onclick="d.value+='5'">5</button><button onclick="d.value+='6'">6</button><button onclick="d.value+='7'">7</button><button onclick="d.value+='8'">8</button><button onclick="d.value+='9'">9</button><button onclick="d.value+='*'">*</button><button onclick="d.value+='0'">0</button><button onclick="d.value+='#'">#</button><button class=c onclick="location.href='tel:'+d.value">CALL</button></div></body></html>
